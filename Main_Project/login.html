<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to your DevLearn account.">

    <title>Login - DevLearn</title>
   
</head>

<body>

<header>

    <h1>DevLearn</h1>

    <nav>

        <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="courses.html">Courses</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
    </nav>

</header>


<main>

    <section>

        <h2>Login</h2>

        <form action="#" method="post">

            <fieldset>

                <legend>Account Login</legend>

                <p>

                    <label for="email">
                        Email:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>

                </p>


                <p>

                    <label for="password">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        autocomplete="current-password"
                        required>

                </p>


                <p>

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember">

                    <label for="remember">
                        Remember me
                    </label>

                </p>


                <button type="submit">
                    Login
                </button>

            </fieldset>

        </form>


        <p>

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </p>

    </section>

</main>


<footer>

    <hr>

    <p>&copy; 2026 DevLearn</p>

</footer>

</body>
</html>
